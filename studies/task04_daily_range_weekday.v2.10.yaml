evidence_rating:
  scale:
  - INSUFFICIENT
  - WEAK
  - MODERATE
  - STRONG
  dimensions:
  - chronological_validation
  - year_by_year_stability
  - volatility_regime_stability
  - coverage_profile_stability
  - effect_size_magnitude
  - confidence_interval_precision
  - statistical_significance
  - extreme_event_sensitivity
  thresholds:
    moderate_minimum_epsilon_squared: 0.01
    strong_minimum_epsilon_squared: 0.06
    minimum_rank_correlation: 0.6
    strong_minimum_stable_year_fraction: 0.75
    moderate_maximum_median_ci_relative_width: 0.25
    strong_maximum_median_ci_relative_width: 0.15
    minimum_primary_weekday_sample: 100
    diagnostic_profile_disagreement_blocks_strong: false
    unresolved_timestamp_semantics_maximum_rating: MODERATE
    minimum_regime_sample: 100
    high_regime_significance_role: contextual_only
  required_profiles:
  - DEFAULT_RESEARCH
  - STRICT_CONTINUITY
  diagnostic_profiles:
  - SENSITIVITY_FULL
  - SENSITIVITY_2023
  contradictory_evidence_policy: Assign the highest tier for which every gate is satisfied
    and retain every failed gate in the output. Missing required robustness populations
    produce INSUFFICIENT. Diagnostic-profile disagreement is reported but does not
    by itself block STRONG. Unresolved timestamp semantics caps the rating at MODERATE.
  logic: INSUFFICIENT if the primary test, required lineage, population reconciliation,
    or a required robustness population is unavailable. Otherwise start at WEAK. MODERATE
    requires primary significance, epsilon-squared at least 0.01, at least 100 observations
    per primary weekday, maximum primary median-CI relative width no greater than
    0.25, development/validation ordering correlation at least 0.60, STRICT_CONTINUITY
    ordering correlation at least 0.60, and no ordering reversal in either extreme-event
    sensitivity. STRONG additionally requires epsilon-squared at least 0.06, development
    and validation significance, maximum primary median-CI relative width no greater
    than 0.15, at least 75 percent of sufficient years and every fixed period and
    classified volatility regime to have rank correlation at least 0.60, all required
    profiles to be concordant, and resolved timestamp semantics. Diagnostic profiles
    are reported qualifications rather than required gates. A small p-value alone
    cannot produce STRONG. Every required evidence artifact must be present, structurally
    complete, finite, and sample-sufficient. HIGH-regime significance is contextual
    evidence only; its finite omnibus result and population are nevertheless required
    for a rating above INSUFFICIENT.
  required_periods:
  - full_eligible_sample
  - pre_2020
  - covid_era
  - post_2021
  - development_70
  - validation_30
  required_regimes:
  - LOW
  - MEDIUM
  - HIGH
  required_evidence_artifacts:
  - coverage_profile_comparison.csv
  - weekday_statistics.csv
  - period_robustness.csv
  - yearly_omnibus_tests.csv
  - volatility_regime_statistics.csv
  - volatility_regime_tests.csv
  - extreme_event_sensitivity.csv
  missing_evidence_policy: Any missing, empty, malformed, non-finite, contradictory,
    or sample-insufficient required evidence produces INSUFFICIENT.
known_limitations:
- Raw timestamp open-versus-close convention is unresolved.
- Daily observations may be serially dependent and volatility-clustered.
- UTC calendar days are descriptive and are not local trading sessions.
- Task 02 coverage categories do not establish market-calendar causes.
- Complete-day filtering can alter the represented date population.
- Sensitivity-only profiles are diagnostic populations, not substitutes for the primary
  population.
- Range behaviour does not establish direction, profitability, or a trading rule.
prohibited_analyses:
- returns
- direction
- session_analysis
- ATR
- ADR
- volatility_forecasting
- range_forecasting
- weekly_levels
- liquidity_sweeps
- market_structure
- trading_signals
- profitability
- position_sizing
