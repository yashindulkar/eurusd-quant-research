study_id: TASK-04
registration_version: "2.2"
method_id: RANGE-WEEKDAY-001
method_version: range-weekday-registered-replication-v2.2
title: Daily Range Behaviour by Weekday
status: COMPLETED
registration_classification: correctively registered replication of the developed Task 04 analysis
registration_disclosure: >-
  The study design was locked before the corrected production regeneration.
  However, the underlying analysis had already been developed and its results
  reviewed. The corrected production run is therefore treated as a registered
  replication of the development analysis, not as a pristine first-look
  preregistration.
research_question: >-
  Does the distribution of EUR/USD daily high-low range differ across UTC
  weekdays?
primary_null_hypothesis: >-
  The distribution of EUR/USD daily high-low range is identical across Monday,
  Tuesday, Wednesday, Thursday, and Friday under the preregistered daily and
  eligibility definitions.
primary_alternative_hypothesis: >-
  At least one weekday has a different daily high-low range distribution.
secondary_hypotheses:
  - Estimate which of the ten weekday pairs differ.
  - Estimate the direction and magnitude of pairwise differences.
  - Assess whether weekday ordering is stable across time and coverage profiles.
primary_outcome:
  name: daily_range_pips
  definition: (daily_high - daily_low) / configured EUR/USD pip size
  reporting_unit: pips
  pip_size: 0.0001
unit_of_analysis: one observed UTC calendar date within one coverage profile
calendar_definition:
  timezone: UTC
  utc_day_start_inclusive: "00:00:00"
  utc_day_end_inclusive: "23:59:59.999999"
  local_session_or_rollover_used: false
weekday_definition:
  source: UTC calendar date
  primary_weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday]
  excluded_weekdays: [Saturday, Sunday]
  weekend_dates_remain_traceable: true
timestamp_semantics:
  authoritative_status: UNRESOLVED
  operational_assumption: AS_SUPPLIED_TIMESTAMP_LABEL_DATE
  interpretation: >-
    timestamp_utc is assigned to the UTC calendar date exactly as supplied.
    This is a label-date aggregation assumption and is not a claim that the
    source timestamp denotes candle open or candle close.
  possible_boundary_consequence: >-
    If timestamp_utc denotes candle close rather than candle open, one M15
    interval at a UTC-date or audited weekly boundary may belong to the
    preceding interval date.
  evidence_rating_cap: MODERATE
  source_evidence: reports/audits/raw_data_quality_report.md
primary_coverage_profile: DEFAULT_RESEARCH
sensitivity_profiles:
  required: [STRICT_CONTINUITY]
  diagnostic: [SENSITIVITY_FULL, SENSITIVITY_2023]
daily_completeness_rule:
  row_population_built_before_aggregation: true
  minimum_coverage_ratio: 1.0
  minimum_daily_rows: 1
  require_first_expected_interval: true
  require_last_expected_interval: true
  require_all_expected_intervals: true
  monday_through_thursday_expected_grid: "00:00 through 23:45 UTC at M15 cadence"
  friday_expected_grid: >-
    00:00 UTC through the observed timestamp_before endpoint of the applicable
    RAW-DQ-001 likely_weekly_closure interval, at M15 cadence
  sunday_expected_grid: >-
    The observed timestamp_after endpoint of the applicable RAW-DQ-001
    likely_weekly_closure interval through 23:45 UTC, retained for accounting
    but excluded from weekday inference
  saturday_policy: >-
    Retain any observed date for accounting; no Saturday is eligible for the
    primary weekday comparison.
  unresolved_weekly_boundary_policy: >-
    A Friday without an applicable audited weekly endpoint is incomplete; a
    Sunday without an applicable audited weekly endpoint remains weekend-only.
  partial_days_in_primary_analysis: false
  partial_days_in_sensitivity_analysis: false
  exclude_dataset_boundary_dates: true
boundary_period_policy:
  first_observed_utc_date: retained and explicitly excluded from inference
  final_observed_utc_date: retained and explicitly excluded from inference
  partial_boundary_years: retained under DEFAULT_RESEARCH and assessed through coverage sensitivity
descriptive_statistics:
  - sample_size
  - missing_count
  - mean
  - median
  - standard_deviation
  - variance
  - minimum
  - maximum
  - percentile_1
  - percentile_5
  - percentile_10
  - percentile_25
  - percentile_75
  - percentile_90
  - percentile_95
  - percentile_99
  - interquartile_range
  - median_absolute_deviation
  - coefficient_of_variation
  - skewness
  - excess_kurtosis
  - mean_confidence_interval_95
  - median_confidence_interval_95
  - proportion_above_full_sample_median
statistical_conventions:
  quantile_method: numpy_linear
  variance_convention: sample_ddof_1
  mad_convention: unscaled_median_absolute_deviation
primary_statistical_test:
  name: Kruskal-Wallis
  implementation_id: kruskal_wallis
  groups: [Monday, Tuesday, Wednesday, Thursday, Friday]
  alpha: 0.05
post_hoc_test:
  name: Dunn pairwise rank comparison
  implementation_id: dunn
  comparisons: all_ten_weekday_pairs
multiple_testing_correction:
  method: Holm
  implementation_id: holm
  family: ten_weekday_pairwise_comparisons_within_each_analysis_population
effect_size_measures:
  implementation_ids: [epsilon_squared, eta_squared, omega_squared, cliffs_delta]
  omnibus_nonparametric: epsilon_squared
  omnibus_parametric: [eta_squared, omega_squared]
  pairwise: cliffs_delta
  magnitude_conventions:
    negligible: "[0.00, 0.147)"
    small: "[0.147, 0.330)"
    medium: "[0.330, 0.474)"
    large: "[0.474, 1.00]"
  interpretation_note: descriptive conventions, not universal or trading thresholds
confidence_interval_method:
  mean: deterministic percentile bootstrap
  median: deterministic percentile bootstrap
  pairwise_median_difference: deterministic percentile bootstrap
  confidence_level: 0.95
  seed: 20260727
  resamples: 2000
  dependence_limitation: iid resampling does not remove serial dependence or volatility clustering
normality_diagnostic:
  methods: [skewness, excess_kurtosis, qq_plot_correlation]
  mechanical_pass_fail_gate: false
variance_diagnostic:
  method: Brown-Forsythe Levene test centered on median
  complementary_tests: [one_way_anova, welch_anova]
robustness_analyses:
  - strict_continuity_coverage
  - sensitivity_full_coverage
  - sensitivity_2023_coverage
  - winsorise_at_1st_and_99th_full_sample_percentiles
  - exclude_largest_1_percent_of_full_sample_daily_ranges
  - chronological_periods
  - chronological_70_30_split
  - year_by_year
  - past_only_volatility_regimes
volatility_regime_definition:
  base_measure: trailing median daily_range_pips
  lookback_eligible_weekdays: 60
  current_date_excluded: true
  future_information_used: false
  threshold_history: expanding prior trailing-median measures only
  minimum_prior_regime_measures: 120
  low_quantile: 0.33
  high_quantile: 0.67
  labels: [LOW, MEDIUM, HIGH]
  warmup_label: UNCLASSIFIED
chronological_stability_design:
  periods:
    full_eligible_sample: all eligible dates
    pre_2020: dates before 2020-01-01
    covid_era: 2020-01-01 through 2021-12-31 inclusive
    post_2021: dates from 2022-01-01 onward
  period_boundaries:
    pre_2020_end_exclusive: "2020-01-01"
    covid_start_inclusive: "2020-01-01"
    covid_end_inclusive: "2021-12-31"
    post_2021_start_inclusive: "2022-01-01"
  development_fraction: 0.70
  split_basis: ordered eligible UTC dates
  shuffle: false
  validation_may_change_design: false
  minimum_per_weekday_per_year: 20
missing_data_policy: >-
  Do not impute, insert, interpolate, or repair observations. Retain every
  observed UTC date in daily metadata, report missing expected intervals, and
  exclude incomplete dates from inferential populations under an explicit
  reason.
exclusion_policy:
  primary:
    - weekend UTC date
    - incomplete daily observation
    - first or final observed dataset date
    - no contributing DEFAULT_RESEARCH rows
  outliers: retained in primary analysis
  reversible_sensitivity_only:
    - winsorisation
    - largest_one_percent_exclusion
  winsorisation_limits: [0.01, 0.99]
  largest_tail_exclusion_fraction: 0.01
deterministic_seed_policy:
  seed: 20260727
  algorithm: numpy Generator PCG64
  parallel_random_resampling: false
